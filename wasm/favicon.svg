    <rect x="18" y="20" width="1" height="1"/>
    
    <rect x="14" y="22" width="1" height="1"/>
    <rect x="18" y="22" width="1" height="1"/>
    
    <rect x="14" y="24" width="1" height="1"/>
    <rect x="16" y="24" width="1" height="1"/>
